<!doctype html><meta charset="utf-8"><title>Geländestempel – Prüfung</title><link rel="stylesheet" href="/modules/assets-grimmes-erwachen/catalog.css"><style>body{background:#333;color:white;font:15px sans-serif;margin:0}#result{position:fixed;left:12px;top:0;z-index:10001;width:420px;background:#222;padding:8px}nav{position:fixed;bottom:10px;left:10px;z-index:10001}#field{position:fixed;inset:0;pointer-events:none}#field img{position:absolute}</style><div id="field"></div><p id="result">Bereit</p><nav><button id="open">Stempel öffnen</button><button id="camera">Andere Kamera</button></nav><script type="module">
import {showBrush} from '/modules/assets-grimmes-erwachen/brush.mjs';
const base='/',realFetch=fetch;window.fetch=(url,opt)=>realFetch(typeof url==='string'&&url.startsWith('modules/')?base+url:url,opt);
const src=Object.getOwnPropertyDescriptor(HTMLImageElement.prototype,'src');Object.defineProperty(HTMLImageElement.prototype,'src',{get:src.get,set(v){src.set.call(this,v.startsWith('modules/')?base+v:v);}});
const result=document.querySelector('#result'),field=document.querySelector('#field'),docs=new Map();let count=0,uploads=0,batches=0,zoom=.5,panX=35,panY=25;
window.game={user:{isGM:true},release:{generation:14},world:{id:'stamp-ui'}};window.ui={notifications:{info(){},error:m=>result.textContent=m}};window.Hooks={on:()=>1,off(){}};
function repaint(){field.replaceChildren();for(const t of docs.values()){const img=new Image();img.src=t.texture.src;Object.assign(img.style,{left:`${t.x*zoom+panX}px`,top:`${t.y*zoom+panY}px`,width:`${t.width*zoom}px`,height:`${t.height*zoom}px`});field.append(img);}}
const level={id:'ground',elevation:{bottom:0}};
window.canvas={ready:true,level,dimensions:{sceneRect:{x:100,y:100,width:1600,height:1200}},canvasCoordinatesFromClient:p=>({x:(p.x-panX)/zoom,y:(p.y-panY)/zoom}),clientCoordinatesFromCanvas:p=>({x:p.x*zoom+panX,y:p.y*zoom+panY}),scene:{grid:{size:100,distance:1,units:'m'},tiles:{get:id=>docs.get(id),[Symbol.iterator]:()=>docs.values()},async createEmbeddedDocuments(type,items){batches++;const made=items.map(t=>{const d={id:String(++count),...t};docs.set(d.id,d);return d;});repaint();result.textContent=`Tiles: ${docs.size}; letzter Zug: ${made.length}; Uploads: ${uploads}; Batches: ${batches}; erstes Feld: ${made[0].x}, ${made[0].y}; Größe: ${made[0].width} × ${made[0].height}`;return made;},async deleteEmbeddedDocuments(type,ids){ids.forEach(id=>docs.delete(id));repaint();result.textContent=`Tiles: ${docs.size}; entfernt: ${ids.length}`;}}};
window.foundry={applications:{apps:{FilePicker:{implementation:{browse:async()=>({}),upload:async(s,p,file)=>{uploads++;return{path:URL.createObjectURL(file)};}}}}}};
document.querySelector('#open').onclick=()=>showBrush();document.querySelector('#camera').onclick=()=>{zoom=1;panX=-50;panY=-70;repaint();result.textContent='Kamera: Zoom 1, Versatz -50/-70';};
</script>
