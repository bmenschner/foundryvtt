# Phase 1: Nur HTTP – aktiv VOR der ersten Zertifikatsausstellung
# Nach `init-letsencrypt.sh` diese Datei durch foundry.conf.template ersetzen

server {
    listen 80;
    server_name foundry.bastianmenschner.de;

    # ACME Challenge für Let's Encrypt (muss immer erreichbar sein)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Temporärer HTTP-Proxy (wird nach SSL auf Redirect umgestellt)
    location / {
        proxy_pass         http://foundry:30000;
        proxy_http_version 1.1;

        # WebSocket-Support (zwingend für FoundryVTT!)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 300M;
        proxy_read_timeout   90s;
    }
}

# ── Lokaler Zugriff auf Port 30000 (nur localhost) ─────────────────────────
# Erreichbar unter: http://localhost:30000
# Kein SSL, kein Domain-Check – für lokale Entwicklung / Debugging
server {
    listen 30000;
    server_name localhost 127.0.0.1;

    location / {
        proxy_pass         http://foundry:30000;
        proxy_http_version 1.1;

        # WebSocket-Support (zwingend für FoundryVTT!)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;

        client_max_body_size 300M;
        proxy_read_timeout   90s;
    }
}
