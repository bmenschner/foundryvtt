services:

  # ── FoundryVTT App ──────────────────────────────────────────────────────
  foundry:
    build:
      context: .
      args:
        FOUNDRY_USERNAME: ${FOUNDRY_USERNAME:-}
        FOUNDRY_PASSWORD: ${FOUNDRY_PASSWORD:-}
        FOUNDRY_VERSION: ${FOUNDRY_VERSION:-13.351}
    container_name: foundryvtt
    # Hostname muss stabil bleiben – Foundry bindet die Lizenz daran!
    hostname: foundryvtt
    restart: unless-stopped
    volumes:
      - ./data:/foundry/data
    ports:
      - "127.0.0.1:30000:30000"  # Lokaler Zugriff via SSH-Tunnel (nicht extern erreichbar)

  # ── Caddy Reverse Proxy (automatisches HTTPS via Let's Encrypt) ──────────
  caddy:
    image: caddy:alpine
    container_name: foundry-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # Zertifikate (persistent)
      - caddy_config:/config  # Caddy-Konfigurationscache
    depends_on:
      - foundry

  # ── Automatisches Backup → GitHub ─────────────────────────────────────
  backup:
    build: ./backup
    container_name: foundry-backup
    restart: unless-stopped
    environment:
      BACKUP_REPO:      ${BACKUP_REPO:-git@github.com:bmenschner/foundryvtt-backups.git}
      BACKUP_SCHEDULE:  ${BACKUP_SCHEDULE:-0 3 * * *}   # Standard: täglich 03:00 Uhr
      BACKUP_BRANCH:    ${BACKUP_BRANCH:-main}
      BACKUP_GIT_EMAIL: ${BACKUP_GIT_EMAIL:-backup@foundryvtt}
      TZ:               Europe/Berlin
    volumes:
      - ./data:/backup/data                                # User-Daten (rw: Backup liest, Restore schreibt)
      - ./backup/ssh/backup_key:/root/.ssh/id_ed25519:ro  # SSH Deploy Key (read-only!)
    depends_on:
      - foundry

volumes:
  caddy_data:
  caddy_config:
